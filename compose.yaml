services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Bound to this PC only, so other devices on the network can't reach
      # the database directly. Remove this whole block if you don't need
      # to connect from tools like DBeaver or pgAdmin.
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Makes Keycloak advertise this hostname in its discovery doc,
      # regardless of whether it was reached as "keycloak" (from the app
      # container) or "keycloak.local" (from your browser).
      KC_HOSTNAME: keycloak.local
      KC_HOSTNAME_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      # "db" is the service name above. Containers find each other by name.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    extra_hosts:
      # Lets the app container reach Keycloak via the same hostname your
      # browser uses (see .env.example and README for the hosts-file step).
      - "keycloak.local:host-gateway"
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    ports:
      # Reachable from other devices at http://<this-PC-IP>:8501
      - "8501:8501"

volumes:
  pgdata:
  keycloak_data: